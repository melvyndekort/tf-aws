version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    groups:
      github-actions-root:
        patterns:
          - "*"
    assignees:
      - "melvyndekort"
    reviewers:
      - "melvyndekort"

  - package-ecosystem: "terraform"
    directory: "/management"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    groups:
      terraform-management:
        patterns:
          - "*"
    assignees:
      - "melvyndekort"
    reviewers:
      - "melvyndekort"

  - package-ecosystem: "terraform"
    directory: "/accounts/network-monitor"
    schedule:
      interval: "weekly"
    rebase-strategy: "auto"
    groups:
      terraform-accounts-network-monitor:
        patterns:
          - "*"
    assignees:
      - "melvyndekort"
    reviewers:
      - "melvyndekort"
