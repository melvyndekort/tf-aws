# Split per the gha-workflows reusable-workflow pattern tf-github already
# uses: credential-free validate + read-only PR plan (no environment gate,
# so it actually runs on a pull_request ref) for PRs, environment-gated
# admin apply for pushes to main.
#
# Why this file is still bespoke rather than a thin caller like tf-github's
# terraform-pr.yml/terraform-apply.yml: this repo plans/applies TWO kinds of
# working directory -- the management/ root module directly, and a matrix of
# accounts/<name>/ subaccount modules whose provider must assume a
# cross-account role (TerraformPlanRole for plan, OrganizationAccountAccessRole
# for apply -- see accounts/*/providers.tf's subaccount_role_name variable).
# The shared workflows still do the actual credential handling and plan/apply
# steps; this file only adds the extra job split and the TF_VAR override.
name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'management/**'
      - 'accounts/**'
      - 'modules/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'management/**'
      - 'accounts/**'
      - 'modules/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

# Permissions do NOT inherit into a reusable workflow: a called workflow can
# only narrow what the caller granted, never widen it. Without the explicit
# permissions block on each job below, the run is refused before any job
# starts, with `startup_failure` and no log.
jobs:
  management-validate:
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    uses: melvyndekort/gha-workflows/.github/workflows/terraform-pr-validate.yml@v1
    with:
      working-directory: management

  management-plan:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    needs: management-validate
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: melvyndekort/gha-workflows/.github/workflows/terraform-pr-plan.yml@v1
    with:
      working-directory: management
      comment-title: "Management Account"
    secrets:
      plan-role-arn: ${{ secrets.AWS_PLAN_ROLE_ARN }}

  management-apply:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]'
    permissions:
      id-token: write
      contents: read
    uses: melvyndekort/gha-workflows/.github/workflows/terraform-apply.yml@v1
    with:
      working-directory: management
      environment: production
    secrets:
      role-arn: ${{ secrets.AWS_ROLE_ARN }}

  subaccounts-validate:
    if: github.actor != 'dependabot[bot]'
    strategy:
      matrix:
        include:
          - account: network-monitor
          - account: hermes-agent
    permissions:
      contents: read
    uses: melvyndekort/gha-workflows/.github/workflows/terraform-pr-validate.yml@v1
    with:
      working-directory: accounts/${{ matrix.account }}

  subaccounts-plan:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    needs:
      - management-plan
      - subaccounts-validate
    strategy:
      matrix:
        include:
          - account: network-monitor
          - account: hermes-agent
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: melvyndekort/gha-workflows/.github/workflows/terraform-pr-plan.yml@v1
    with:
      working-directory: accounts/${{ matrix.account }}
      comment-title: "Account: ${{ matrix.account }}"
      # The default provider role in accounts/<name>/providers.tf is the
      # admin OrganizationAccountAccessRole (used at apply time). Point it at
      # the read-only TerraformPlanRole for the duration of this plan instead
      # -- same idiom tf-github's own terraform-pr.yml uses for its
      # subaccount_role_name variable.
      tf-vars: TF_VAR_subaccount_role_name=TerraformPlanRole
    secrets:
      plan-role-arn: ${{ secrets.AWS_PLAN_ROLE_ARN }}

  subaccounts-apply:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]'
    needs: management-apply
    strategy:
      matrix:
        include:
          - account: network-monitor
          - account: hermes-agent
    permissions:
      id-token: write
      contents: read
    uses: melvyndekort/gha-workflows/.github/workflows/terraform-apply.yml@v1
    with:
      working-directory: accounts/${{ matrix.account }}
      environment: production
    secrets:
      role-arn: ${{ secrets.AWS_ROLE_ARN }}
